<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C4 Model - Nível 1: Diagrama de Contexto (CardápioHub)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --person-color: #0284c7;
      --system-color: #0369a1;
      --core-system-color: #2563eb;
      --external-color: #475569;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --arrow-color: #64748b;
      --arrow-label: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .diagram-container {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      width: 100%;
      max-width: 1100px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Estilos dos Nós do Diagrama */
    .node-person {
      fill: #0ea5e9;
      stroke: #38bdf8;
      stroke-width: 2;
    }

    .node-core {
      fill: #1d4ed8;
      stroke: #60a5fa;
      stroke-width: 3;
      filter: drop-shadow(0 0 12px rgba(37, 99, 235, 0.45));
    }

    .node-external {
      fill: #334155;
      stroke: #64748b;
      stroke-width: 2;
    }

    .text-title {
      fill: #ffffff;
      font-weight: 700;
      font-size: 14px;
      text-anchor: middle;
    }

    .text-type {
      fill: #e2e8f0;
      font-weight: 500;
      font-size: 11px;
      text-anchor: middle;
      opacity: 0.85;
    }

    .text-desc {
      fill: #cbd5e1;
      font-size: 10.5px;
      text-anchor: middle;
    }

    /* Conexões e Setas */
    .relationship-line {
      stroke: var(--arrow-color);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 4, 4;
    }

    .label-box {
      fill: #0f172a;
      stroke: #334155;
      stroke-width: 1;
      rx: 4px;
    }

    .rel-text {
      fill: var(--arrow-label);
      font-size: 10px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 24px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .legend-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .legend-box.person { background: #0ea5e9; }
    .legend-box.core { background: #1d4ed8; }
    .legend-box.external { background: #334155; }
  </style>
</head>
<body>

  <div class="header">
    <h1>CardápioHub — Diagrama de Contexto de Sistema</h1>
    <p>Modelo C4 (Nível 1): Visão macro de atores, fronteiras e integrações externas</p>
  </div>

  <div class="diagram-container">
    <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Marcador de Flecha -->
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
        </marker>
      </defs>

      <!-- ================= RELAÇÕES / SETAS COM VERBOS ================= -->
      
      <!-- 1. Cliente -> CardápioHub -->
      <path class="relationship-line" marker-end="url(#arrow)" d="M 440, 160 L 470, 270" />
      <g transform="translate(420, 215)">
        <rect class="label-box" x="-85" y="-12" width="170" height="24" />
        <text class="rel-text">Consulta cardápio e faz pedidos</text>
      </g>

      <!-- 2. Gestor -> CardápioHub -->
      <path class="relationship-line" marker-end="url(#arrow)" d="M 230, 290 L 370, 325" />
      <g transform="translate(290, 295)">
        <rect class="label-box" x="-75" y="-12" width="150" height="24" />
        <text class="rel-text">Cadastra itens e relatórios</text>
      </g>

      <!-- 3. Cozinha -> CardápioHub -->
      <path class="relationship-line" marker-end="url(#arrow)" d="M 230, 485 L 380, 420" />
      <g transform="translate(300, 465)">
        <rect class="label-box" x="-75" y="-12" width="150" height="24" />
        <text class="rel-text">Atualiza status do pedido</text>
      </g>

      <!-- 4. CardápioHub -> Gateway -->
      <path class="relationship-line" marker-end="url(#arrow)" d="M 630, 325 L 770, 290" />
      <g transform="translate(700, 295)">
        <rect class="label-box" x="-70" y="-12" width="140" height="24" />
        <text class="rel-text">Processa pagamentos</text>
      </g>

      <!-- 5. CardápioHub -> Mensageria -->
      <path class="relationship-line" marker-end="url(#arrow)" d="M 630, 420 L 770, 485" />
      <g transform="translate(700, 465)">
        <rect class="label-box" x="-75" y="-12" width="150" height="24" />
        <text class="rel-text">Dispara alertas de entrega</text>
      </g>

      <!-- 6. CardápioHub -> Cliente (Feedback) -->
      <path class="relationship-line" marker-end="url(#arrow)" d="M 540, 270 L 560, 160" />
      <g transform="translate(585, 215)">
        <rect class="label-box" x="-70" y="-12" width="140" height="24" />
        <text class="rel-text">Notifica confirmação</text>
      </g>

      <!-- ================= NÓS / ELEMENTOS ================= -->

      <!-- ATORES (PESSOAS) -->
      
      <!-- Cliente Final -->
      <g transform="translate(400, 40)">
        <rect class="node-person" width="200" height="120" rx="8" />
        <circle cx="100" cy="24" r="12" fill="#e0f2fe" opacity="0.3"/>
        <text class="text-title" x="100" y="52">Cliente Final</text>
        <text class="text-type" x="100" y="68">[Pessoa]</text>
        <text class="text-desc" x="100" y="90">Consumidor que faz pedidos</text>
        <text class="text-desc" x="100" y="105">de comida online</text>
      </g>

      <!-- Gestor do Restaurante -->
      <g transform="translate(30, 230)">
        <rect class="node-person" width="200" height="120" rx="8" />
        <circle cx="100" cy="24" r="12" fill="#e0f2fe" opacity="0.3"/>
        <text class="text-title" x="100" y="52">Gestor do Restaurante</text>
        <text class="text-type" x="100" y="68">[Pessoa]</text>
        <text class="text-desc" x="100" y="90">Dono/Gerente que cadastra</text>
        <text class="text-desc" x="100" y="105">produtos e confere vendas</text>
      </g>

      <!-- Operação / Cozinha -->
      <g transform="translate(30, 430)">
        <rect class="node-person" width="200" height="120" rx="8" />
        <circle cx="100" cy="24" r="12" fill="#e0f2fe" opacity="0.3"/>
        <text class="text-title" x="100" y="52">Cozinha / Operação</text>
        <text class="text-type" x="100" y="68">[Pessoa]</text>
        <text class="text-desc" x="100" y="90">Pizzaiolo/Chapa que recebe</text>
        <text class="text-desc" x="100" y="105">comandas e avança pedidos</text>
      </g>

      <!-- SISTEMA CENTRAL (CARDÁPIOHUB) -->
      <g transform="translate(370, 270)">
        <rect class="node-core" width="260" height="160" rx="10" />
        <text class="text-title" x="130" y="50" font-size="16">CardápioHub</text>
        <text class="text-type" x="130" y="70">[Sistema de Software Central]</text>
        <text class="text-desc" x="130" y="100">SaaS Multi-tenant para</text>
        <text class="text-desc" x="130" y="118">gestão de cardápios, pedidos</text>
        <text class="text-desc" x="130" y="136">e esteira de encomendas</text>
      </g>

      <!-- SISTEMAS EXTERNOS -->

      <!-- Gateway de Pagamento -->
      <g transform="translate(770, 230)">
        <rect class="node-external" width="200" height="120" rx="8" />
        <text class="text-title" x="100" y="45">Gateway Pagamentos</text>
        <text class="text-type" x="100" y="63">[Sistema Externo]</text>
        <text class="text-desc" x="100" y="85">Processa pagamentos via</text>
        <text class="text-desc" x="100" y="100">Pix e cartão de crédito</text>
      </g>

      <!-- Notificações / Mensageria -->
      <g transform="translate(770, 430)">
        <rect class="node-external" width="200" height="120" rx="8" />
        <text class="text-title" x="100" y="45">Serviço de Mensageria</text>
        <text class="text-type" x="100" y="63">[Sistema Externo]</text>
        <text class="text-desc" x="100" y="85">Dispara WhatsApp/SMS/Push</text>
        <text class="text-desc" x="100" y="100">sobre o status da entrega</text>
      </g>

    </svg>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-box person"></div>
      <span>Ator (Pessoa)</span>
    </div>
    <div class="legend-item">
      <div class="legend-box core"></div>
      <span>Sistema em Foco (SaaS)</span>
    </div>
    <div class="legend-item">
      <div class="legend-box external"></div>
      <span>Sistema Externo</span>
    </div>
  </div>

</body>
</html>
